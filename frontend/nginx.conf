# Prefer JSON API over SPA when Accept includes application/json (axios).
# Browser navigations send text/html without application/json → SPA shell.
map $http_accept $ayniflow_shared_target {
    default               api;
    ~*application/json    api;
    ~*text/html           spa;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Never let the browser keep a single cached body for SPA+API shared URLs.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # OAuth callback — Google redirige con Accept: text/html; debe ir siempre al backend
    location ^~ /finance/integrations/gmail/oauth/callback {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # WebSocket — prioridad sobre el proxy API de /finance
    location ^~ /finance/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location ~ ^/(auth|health|docs|openapi\.json)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Rutas compartidas SPA + API (misma URL). Sin Cache-Control/Vary el navegador
    # cachea index.html en /users y luego axios recibe HTML → listas vacías.
    location ~ ^/(users|roles|permissions|finance)(/|$) {
        error_page 418 = @shared_spa;
        if ($ayniflow_shared_target = spa) {
            return 418;
        }

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
    }

    location @shared_spa {
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
        try_files /index.html =404;
    }
}
