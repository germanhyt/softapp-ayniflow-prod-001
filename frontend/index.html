<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4b5320" />
    <meta name="description" content="AyniFlow — plataforma modular de gestión financiera." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AyniFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <title>AyniFlow</title>
    <style>
      #root:empty {
        min-height: 100vh;
        background: #000;
      }
      #root:empty::before {
        content: '';
        display: block;
        width: 9rem;
        height: 2.25rem;
        margin: 1rem 0 0 1rem;
        border-radius: 0.5rem;
        background: linear-gradient(90deg, #1a1a1a 25%, #262626 50%, #1a1a1a 75%);
        background-size: 200% 100%;
        animation: ayni-skeleton 1.2s ease-in-out infinite;
      }
      #root:empty::after {
        content: '';
        display: block;
        margin: 1.5rem 1rem 0;
        height: 0.875rem;
        max-width: 12rem;
        border-radius: 0.375rem;
        background: linear-gradient(90deg, #1a1a1a 25%, #262626 50%, #1a1a1a 75%);
        background-size: 200% 100%;
        animation: ayni-skeleton 1.2s ease-in-out infinite;
      }
      @keyframes ayni-skeleton {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
